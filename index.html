<html lang="en">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Posto Supper Club Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
/* Layout: one column run-sheet, sticky section nav, menu as a ledger table, checklists in two-up grids that stack on phones */
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --ink:#1B1A17; --muted:#6B665C; --line:#E3DFD6;
  --marigold:#C77800; --marigold-text:#8F5600; --marigold-soft:#FBEFD9;
  --green:#2F5D50; --green-soft:#E3EEEA; --warn:#A23B2A; --warn-soft:#F8E6E2;
  --display:"Marcellus",Georgia,serif; --body:"Karla",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1D1B18; --ink:#EDEAE3; --muted:#A39D90; --line:#34312B;
  --marigold:#F0A63A; --marigold-text:#F3B65A; --marigold-soft:#3A2A12;
  --green:#7FB8A4; --green-soft:#1C2E28; --warn:#F08A76; --warn-soft:#3A1E19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1D1B18; --ink:#EDEAE3; --muted:#A39D90; --line:#34312B;
  --marigold:#F0A63A; --marigold-text:#F3B65A; --marigold-soft:#3A2A12;
  --green:#7FB8A4; --green-soft:#1C2E28; --warn:#F08A76; --warn-soft:#3A1E19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.05;letter-spacing:.01em}
h2{font-size:1.65rem}
h3{font-size:1.15rem}
.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--marigold-text);font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.hero{display:grid;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.95rem}
.facts b{font-weight:700}
.count{display:inline-flex;align-items:baseline;gap:8px;background:var(--marigold-soft);color:var(--marigold-text);padding:6px 12px;border-radius:999px;font-weight:700;width:fit-content}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:8px}
nav.toc .in{display:flex;gap:4px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.toc a{white-space:nowrap;color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:.9rem}
nav.toc a:hover,nav.toc a:focus-visible{background:var(--marigold-soft);outline:none}
section{padding-top:36px;display:grid;gap:16px;scroll-margin-top:56px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.status{font-size:.85rem;color:var(--muted);min-height:1.3em}
.status.ro{color:var(--warn)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.meter .n{font-family:var(--mono);font-size:1.3rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--marigold)}
.bar.g i{background:var(--green)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.no{font-family:var(--display);font-size:1.5rem;line-height:1;width:44px}
.dish{font-weight:700}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;margin:1px 2px 1px 0}
.c-anuja{background:var(--marigold-soft);color:var(--marigold-text)}
.c-amrita{background:var(--green-soft);color:var(--green)}
.c-both{border:1px solid var(--ink);color:var(--ink)}
.c-toby{background:var(--line);color:var(--ink)}
.c-flag{background:var(--warn-soft);color:var(--warn)}
.who-line{display:block;margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.85rem;color:var(--muted);align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
ul.check{list-style:none;margin:0;padding:0;display:grid}
ul.check li{border-top:1px solid var(--line)}
ul.check li:first-child{border-top:0}
ul.check label{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 0;cursor:pointer}
ul.check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--marigold)}
ul.check .done .t{text-decoration:line-through;color:var(--muted)}
.t small{display:block;color:var(--muted);font-size:.82rem}
.due{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap;padding-top:2px}
.ro-mode ul.check label{cursor:default}
.run{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.run .row{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:8px 0 8px 16px;position:relative}
.run .row::before{content:"";position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.run .row.course::before{background:var(--marigold);border-color:var(--marigold)}
.run .time{font-family:var(--mono);font-size:.9rem;padding-top:1px}
.daylabel{font-family:var(--display);font-size:1.15rem;margin:18px 0 4px}
.msg{white-space:pre-wrap;font-family:var(--body);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0;font-size:.95rem;max-height:520px;overflow:auto}
button{font:inherit;font-weight:700;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.note{background:var(--marigold-soft);border-radius:10px;padding:12px 14px;font-size:.92rem}
.note.warn{background:var(--warn-soft)}
ol.q{margin:0;padding-left:1.3em;display:grid;gap:10px}
ol.q li small{color:var(--muted);display:block}
p{margin:0;max-width:68ch}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>

 +'<div class="tablewrap"><table><thead><tr><th>#</th><th>Course</th><th>Cooking</th><th>Plating</th><th>Serve in</th><th>Diet &amp; allergens</th><th>Notes</th></tr></thead><tbody>'+c+'</tbody></table></div>'
 +'<p class="note">The venue has plates, cutlery, a dishwasher, one portable hob and a microwave. There is no oven, so everything arrives cooked and only needs reheating or assembling.</p>'
 +'<p class="note warn">Allergen tags are our best guess from the dish names. Check them against your recipes before the allergen cards go out.</p></section>'
 +'<section id="shopping"><div class="sec-head"><h2>Shopping &amp; serveware</h2></div><div class="grid2">'
 +'<div class="card"><div class="card-head"><h3>AS</h3><span class="mono muted">'+cnt(ids(SHOP.amrita))+'/'+SHOP.amrita.length+'</span></div>'+checklist(SHOP.amrita)+'</div>'
 +'<div class="card"><div class="card-head"><h3>AB</h3><span class="mono muted">'+cnt(ids(SHOP.anuja))+'/'+SHOP.anuja.length+'</span></div>'+checklist(SHOP.anuja)+'</div></div></section>'
 +'<section id="todo"><div class="sec-head"><h2>To-do before the day</h2><span class="mono muted">'+cnt(ids(TASKS))+'/'+TASKS.length+'</span></div><div class="card">'+checklist(TASKS,true)+'</div></section>'
 +'<section id="day"><div class="sec-head"><h2>On the day</h2></div><p class="muted">We only get in at 3pm, so courses start at 3:40 and run about 12 minutes each. One hob: shorba and bhaji share it, then the chai. The lamb and pulao go in the microwave.</p><div class="run">'+run+'</div></section>'
 +'<section id="message"><div class="sec-head"><h2>Guest message</h2><button type="button" id="copy">Copy message</button></div>'
 +'<p class="muted">Ready to send. In WhatsApp, *stars* turn into bold.</p><pre class="msg" id="msgtext">'+esc(MESSAGE)+'</pre>'
 +'<p class="note">Butlers Wine Cellar has moved from Queens Park Road to its Kemp Town shop at 88 St George\'s Road (01273 698724). Our sources are from 2022, so give them a quick call to check before sending.</p></section>'
 +'<section id="dietary"><div class="sec-head"><h2>Dietary form</h2></div>'
 +'<p>Live form: <a href="https://forms.gle/jUdCwUTPVADV7vrK9">forms.gle/jUdCwUTPVADV7vrK9</a>. Replies collect in the Responses tab of the form.</p>'
 +'<div class="card"><h3>Title: Posto Kitchen Supper Club, 7 Nov: dietary requirements</h3><p class="muted">Description: Help us cook for you! Please reply by Wednesday 4 November.</p><ol class="q">'+FORM.map(function(q){return '<li>'+esc(q[0])+'<small>'+esc(q[1])+'</small></li>'}).join('')+'</ol></div>'
 +'<p class="note">Quicker option: in Eventbrite, go to <b>Manage event → Order options → Order form</b> and add a required question "Dietary requirements or allergies". Everyone who books answers it, and the answers appear in the attendee report.</p></section>'
 +'<section id="questions"><div class="sec-head"><h2>Open questions</h2></div><div class="card"><ul class="check">'
 +['Does the venue have wine glasses? Still finding out'].map(function(q){return '<li><label style="grid-template-columns:1fr"><span class="t">'+q+'</span></label></li>'}).join('')
 +'</ul></div></section></div>';
 bind();
}

function setStatus(t,ro){statusText=t;statusRO=!!ro;var el=document.getElementById("status");if(el){el.textContent=t;el.className="status"+(ro?" ro":"")}}

function bind(){
 document.querySelectorAll('input[data-id]').forEach(function(cb){cb.addEventListener("change",function(){
  if(readOnly)return;var id=cb.getAttribute("data-id");
  if(cb.checked)state.done[id]=true;else delete state.done[id];
  render();save(id,cb.checked)})});
 var b=document.getElementById("copy");if(b)b.addEventListener("click",function(){
  var done=function(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy message"},1800)};
  var sel=function(){var r=document.createRange();r.selectNodeContents(document.getElementById("msgtext"));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selected: press Ctrl+C"};
  try{navigator.clipboard.writeText(MESSAGE).then(done,sel)}catch(e){sel()}});
}

var LABELS={};
SHOP.amrita.concat(SHOP.anuja,TASKS).forEach(function(x){LABELS[x[0]]=x[1]});

function setDone(d){state={done:d||{}};render()}

function load(quiet){
 if(!SHEET_URL){setStatus("Not connected to the Google Sheet yet: ticks won't be shared.",true);return}
 if(!quiet)setStatus("Loading ticks…");
 fetch(SHEET_URL,{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
  var keep=statusText;setDone(d.done);setStatus(quiet?keep:"Up to date")
 }).catch(function(){setStatus("Couldn't reach the Google Sheet. Check your connection and refresh.",true)});
}

var pending=0;
function save(id,on){
 if(!SHEET_URL){setStatus("Not connected to the Google Sheet yet: this tick won't be shared.",true);return}
 pending++;setStatus("Saving…");
 fetch(SHEET_URL,{method:"POST",body:JSON.stringify({id:id,item:LABELS[id]||id,done:on})})
  .then(function(r){return r.json()}).then(function(d){pending--;if(!pending){setDone(d.done);setStatus("Saved")}})
  .catch(function(){pending--;if(on)delete state.done[id];else state.done[id]=true;render();setStatus("Couldn't save that tick. Try again.",true)});
}

render();
load();
setInterval(function(){if(!pending&&document.visibilityState==="visible")load(true)},30000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!pending)load(true)});
})();
</script>
</body>
</html>
